<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青蛙貼布 登場動畫</title>
<style>
  html,body { margin:0; height:100%; background:#e9f1e2; overflow:hidden;
    font-family:system-ui,'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; color:#333; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }
  .tag { position:fixed; top:16px; left:20px; font-size:13px; color:#666; background:#ffffffb0; padding:6px 10px; border-radius:8px; }
  .tag b { color:#333; font-weight:600; }
  #shotname { position:fixed; top:52px; left:20px; font-size:13px; color:#333; background:#ffffffb0; padding:6px 10px; border-radius:8px; }
  .bar { position:fixed; left:20px; right:316px; bottom:18px; max-width:760px; margin:0 auto;
    background:#ffffffd9; border-radius:14px; padding:10px 14px; box-shadow:0 4px 18px #0000001a; }
  .row { display:flex; align-items:center; gap:10px; }
  button { font:inherit; font-size:13px; border:0; border-radius:9px; padding:7px 12px; background:#333; color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:#333; box-shadow:inset 0 0 0 1px #0002; }
  .bar input[type=range] { flex:1; accent-color:#333; }
  #time { font-variant-numeric:tabular-nums; font-size:13px; min-width:84px; text-align:right; color:#555; }
  .marks { position:relative; height:18px; margin-top:4px; }
  .marks span { position:absolute; transform:translateX(-50%); font-size:11px; color:#777; cursor:pointer; white-space:nowrap; }
  .marks span:hover { color:#000; }
  label.chk { font-size:13px; color:#555; display:flex; align-items:center; gap:4px; cursor:pointer; user-select:none; }
  #panel { position:fixed; top:16px; right:16px; bottom:16px; width:284px; overflow:auto; background:#ffffffe6;
    border-radius:14px; box-shadow:0 4px 18px #0000001a; padding:14px 16px; box-sizing:border-box; }
  #panel.min { bottom:auto; }
  #panel.min .body { display:none; }
  #panel h2 { margin:0; font-size:14px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  #panel h3 { margin:16px 0 6px; font-size:12px; font-weight:600; color:#888; letter-spacing:.05em; }
  .ctl { margin:8px 0 10px; }
  .ctl .top { display:flex; justify-content:space-between; font-size:13px; }
  .ctl .top output { font-variant-numeric:tabular-nums; color:#555; }
  .ctl input { width:100%; accent-color:#333; margin:4px 0 0; }
  .ctl small { display:block; font-size:11px; color:#999; margin-top:1px; }
  .btns { display:flex; gap:8px; margin-top:14px; }
  .btns button { flex:1; }
  #toggle { padding:4px 9px; font-size:12px; }
  #copied { font-size:12px; color:#2a7a4f; min-height:16px; margin-top:6px; }
  #dump { width:100%; box-sizing:border-box; font:12px/1.5 ui-monospace,monospace; margin-top:6px; display:none; }
  body.pmin .bar { right:20px; }
  @media (max-width: 720px) {
    #panel { top:auto; left:12px; right:12px; width:auto; height:42vh; bottom:92px; }
    .bar { right:20px; }
  }
</style>
</head>
<body class="pmin">
<div id="stage"></div>
<div class="tag"><b>上色版</b>　青蛙貼布夾鏈袋 登場動畫</div>
<div id="shotname"></div>

<div class="bar">
  <div class="row">
    <button id="play">重播</button>
    <input id="scrub" type="range" min="0" max="6" step="0.01" value="0">
    <span id="time">0.00 / 6.00 s</span>
    <label class="chk"><input id="loop" type="checkbox"> 循環</label>
  </div>
  <div class="marks" id="marks"></div>
</div>

<aside id="panel" class="min">
  <h2>調整面板 <button id="toggle" class="ghost">展開</button></h2>
  <div class="body">
    <h3>速度</h3>
    <div id="speedCtls"></div>
    <h3>透視與鏡頭</h3>
    <div id="camCtls"></div>
    <div class="btns">
      <button id="reset" class="ghost">全部重設</button>
      <button id="copy">複製參數</button>
    </div>
    <div id="copied"></div>
    <textarea id="dump" rows="6" readonly></textarea>
  </div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

import { makeFourLayerPatch } from '../../../js/patch.js';

// ---------- 可調參數 ----------
const DEFS = [
  // key, 標籤, min, max, step, 預設, 單位, 群組, 說明
  ['speed',  '播放速度',      0.1, 2,   0.05, 1.6, '×', 'speed', '整段動畫一起變快或變慢'],
  ['fly',    '飛入時間',      0.5, 4,   0.05, 1.7, ' 秒', 'speed', '右下角 → 中央'],
  ['pause',  '停頓',          0,   1.5, 0.05, 0,   ' 秒', 'speed', '到中央後、撕開前'],
  ['tear',   '撕開時間',      0.3, 3,   0.05, 1.0, ' 秒', 'speed', '易撕條由左撕到右並捲起'],
  ['finale', '轉正＋開袋＋抽出', 0.8, 5, 0.05, 0.9, ' 秒', 'speed', ''],
  ['spins',  '翻轉圈數',      0,   3,   0.5,  3,   ' 圈', 'speed', '飛入途中的 3D 翻轉'],
  ['fov',    '透視強度（視角）', 8, 75,  1,    75,  '°',  'cam',   '小＝扁平、接近正投影；大＝廣角、近大遠小'],
  ['elev',   '俯視角度',      -20, 45,  1,    0,   '°',  'cam',   '正值＝從上往下看'],
  ['azim',   '左右角度',      -60, 60,  1,    0,   '°',  'cam',   '正值＝鏡頭往右繞'],
  ['zoom',   '畫面大小',      0.5, 1.6, 0.02, 1,    '×',  'cam',   '袋子在畫面中的大小'],
];
const P = {};
let saved = {};
try { saved = JSON.parse(localStorage.getItem('frogAnimParamsColor') || '{}'); } catch (e) {}
for (const d of DEFS) P[d[0]] = saved[d[0]] ?? d[5];
const save = () => { try { localStorage.setItem('frogAnimParamsColor', JSON.stringify(P)); } catch (e) {} };

// ---------- 時間軸（由參數計算）----------
let T = {}, SHOTS = [];
function buildTimeline() {
  const f = P.finale;
  T.flyEnd = P.fly;
  T.tearStart = T.flyEnd + P.pause;
  T.tearEnd = T.tearStart + P.tear;
  T.dropEnd = T.tearEnd + 0.35;          // 捲好後縮小彈掉
  T.uprightStart = T.tearEnd + 0.4;
  T.uprightEnd = T.uprightStart + 0.36 * f;
  T.openStart = T.uprightStart + 0.27 * f;
  T.openEnd = T.openStart + 0.36 * f;
  T.patchStart = T.uprightStart + 0.55 * f;
  T.patchEnd = T.patchStart + 0.45 * f;
  T.total = Math.max(T.patchEnd, T.dropEnd) + 0.8;
  SHOTS = [[0, '鏡頭 1　右下角進場'], [T.flyEnd * 0.25, '鏡頭 2　翻轉飛向中央'], [T.flyEnd, '鏡頭 3　停在中央'],
    [T.tearStart, '鏡頭 4　撕開、捲起、彈掉'], [T.uprightStart, '鏡頭 5　轉正、貼布探出']];
  if (T.tearStart - T.flyEnd < 0.25 * T.total / 6) {           // 沒有停頓時合併鏡頭 3、4 的標籤
    SHOTS.splice(2, 2, [T.flyEnd, '鏡頭 3–4　到中央就撕開、捲起、彈掉']);
  }
}
buildTimeline();

// ---------- 場景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9f1e2');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight('#fff', 1.8); sun.position.set(0.5, 1, 1.2); scene.add(sun);
scene.add(new THREE.HemisphereLight('#ffffff', '#bdbdbd', 0.5));

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.005, 50);
const AIM = new THREE.Vector3(0, -0.035, 0);
const BASE_HALF = 0.95 * Math.tan(THREE.MathUtils.degToRad(15));   // 預設構圖的半高
function setupCamera() {
  camera.fov = P.fov;
  camera.aspect = innerWidth / innerHeight;
  const dist = BASE_HALF / P.zoom / Math.tan(THREE.MathUtils.degToRad(P.fov / 2));  // 改視角時自動推拉，袋子大小不變
  const el = THREE.MathUtils.degToRad(P.elev), az = THREE.MathUtils.degToRad(P.azim);
  camera.position.set(AIM.x + dist * Math.sin(az) * Math.cos(el), AIM.y + dist * Math.sin(el), AIM.z + dist * Math.cos(az) * Math.cos(el));
  camera.lookAt(AIM);
  camera.near = dist * 0.02; camera.far = dist * 20;
  const f = freeRect();   // 把畫面中心移到「沒被面板擋住」的區域
  camera.setViewOffset(innerWidth, innerHeight,
    innerWidth / 2 - (f.x0 + f.x1) / 2, innerHeight / 2 - (f.y0 + f.y1) / 2, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
}
setupCamera();

// 沒被面板與控制列擋住的區域（像素）
function freeRect() {
  const panel = document.getElementById('panel');
  const mobile = innerWidth <= 720, min = panel.classList.contains('min');
  const x1 = innerWidth - (!mobile && !min ? 316 : 0);
  const y1 = innerHeight - (mobile && !min ? innerHeight * 0.42 + 100 : 100);
  return { x0: 0, y0: mobile || min ? 40 : 0, x1, y1: Math.max(y1, innerHeight * 0.35) };
}
// 把可視區域中的位置（-1~1）換成畫布座標
function freeToNdc(fx, fy) {
  const f = freeRect();
  const px = f.x0 + (fx + 1) / 2 * (f.x1 - f.x0), py = f.y0 + (1 - fy) / 2 * (f.y1 - f.y0);
  return [px / innerWidth * 2 - 1, 1 - py / innerHeight * 2];
}
// 把螢幕上的位置（-1~1）換成通過原點、面向鏡頭的平面上的 3D 點
const _ray = new THREE.Raycaster(), _plane = new THREE.Plane();
function screenToWorld(nx, ny) {
  const n = new THREE.Vector3(); camera.getWorldDirection(n);
  _plane.setFromNormalAndCoplanarPoint(n, new THREE.Vector3());
  const [ax, ay] = freeToNdc(nx, ny);
  _ray.setFromCamera(new THREE.Vector2(ax, ay), camera);
  const out = new THREE.Vector3();
  return _ray.ray.intersectPlane(_plane, out) || out;
}

// 易撕條材質（貼圖在模型載入後指定）
const M = {
  strip: new THREE.MeshStandardMaterial({ roughness: 0.32, side: THREE.FrontSide }),
  stripB: new THREE.MeshStandardMaterial({ roughness: 0.32, side: THREE.BackSide }),
};
const rig = new THREE.Group(); scene.add(rig);
let morphMeshes = [], patch, patch0, ready = false;

// ---------- 易撕條（程式產生，可捲曲）----------
const SW = 0.14, SH = 0.01185, COLS = 140, ROWS = 3;
const SY = 0.225 - SH / 2 - 0.1125;
const stripGeo = new THREE.PlaneGeometry(SW, SH, COLS, ROWS);
const basePos = stripGeo.attributes.position.array.slice();
// 易撕條：正面一層、背面一層，各自貼上包裝頂端對應位置的圖案
const stripGeoB = stripGeo.clone();
function stripUV(geo, back) {
  const p = geo.attributes.position.array, uv = geo.attributes.uv.array;
  for (let i = 0; i < p.length / 3; i++) {
    const xmm = (p[i * 3] + SW / 2) * 1000, zmm = (SY + 0.1125 + p[i * 3 + 1]) * 1000;
    uv[i * 2] = back ? 0.5 + (140 - xmm) / 280 : xmm / 280;
    uv[i * 2 + 1] = 1 - zmm / 225;
  }
  geo.attributes.uv.needsUpdate = true;
}
stripUV(stripGeo, false); stripUV(stripGeoB, true);
const strip = new THREE.Group();
const stripF = new THREE.Mesh(stripGeo, M.strip), stripB = new THREE.Mesh(stripGeoB, M.stripB);
strip.add(stripF, stripB);
strip.matrixAutoUpdate = false;
scene.add(strip);
const stripLocal = new THREE.Matrix4().makeTranslation(0, SY, 0);

function curlStrip(p) {
  const pos = stripGeo.attributes.position.array;
  const xt = -SW / 2 + p * SW;
  const colX = [], colZ = [], colY = [];
  let px = xt, pz = 0, py = 0, phi = 0, s = 0, prevX = xt;
  for (let c = COLS; c >= 0; c--) {
    const x = -SW / 2 + (c / COLS) * SW;
    if (x >= xt) { colX[c] = x; colZ[c] = 0; colY[c] = 0; continue; }
    const steps = 4, ds = (prevX - x) / steps;
    for (let k = 0; k < steps; k++) {
      const R = 0.018 * (1 - 0.5 * Math.min(1, s / SW));
      phi += ds / R; s += ds;
      px -= Math.cos(phi) * ds; pz += Math.sin(phi) * ds; py += ds * 0.06;
    }
    prevX = x;
    colX[c] = px; colZ[c] = pz; colY[c] = py;
  }
  for (let i = 0; i < pos.length / 3; i++) {
    const c = i % (COLS + 1);
    pos[i * 3] = colX[c];
    pos[i * 3 + 1] = basePos[i * 3 + 1] + colY[c];
    pos[i * 3 + 2] = colZ[c];
  }
  stripGeo.attributes.position.needsUpdate = true;
  stripGeo.computeVertexNormals();
  stripGeoB.attributes.position.array.set(pos);
  stripGeoB.attributes.position.needsUpdate = true;
  stripGeoB.computeVertexNormals();
}

// ---------- 模型 ----------
new GLTFLoader().load('../../../img/3d/frog_pouch.glb', (gltf) => {
  const g = gltf.scene;
  g.position.y = -0.1125;
  g.traverse((o) => {
    if (!o.isMesh) return;
    const n = o.material.name || '';
    if (n.startsWith('Pouch_Print')) { M.strip.map = o.material.map; M.stripB.map = o.material.map; M.strip.needsUpdate = M.stripB.needsUpdate = true; }
    if (o.morphTargetInfluences) morphMeshes.push(o);
  });
  g.getObjectByName('Tear_Strip').visible = false;
  // ---- 四層貼布（抽出來的那一片）：白 → 綠（蜂巢凸起）→ 藍（電路）→ 白 ----
  const p1 = g.getObjectByName('Patch_1');
  for (const n of ['Patch_1', 'Patch_2', 'Patch_3', 'Patch_4']) g.getObjectByName(n).visible = false;  // 讓出四層貼布的厚度
  const four = makeFourLayerPatch(THREE, RoundedBoxGeometry);
  g.traverse((o) => { if (o.isMesh && (o.material.name || '').startsWith('Patch')) o.material = four.materials.white; });
  patch = four.group;
  patch.position.set(p1.position.x, p1.position.y, 0.0009);
  p1.parent.add(patch);
  patch0 = patch.position.clone();
  rig.add(g);
  ready = true;
  play();
});

// ---------- 動畫（只依時間 t 計算）----------
const ss = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const outCubic = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const outBack = (x) => { x = clamp01(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const TILT = -0.42;

function rigAt(t) {
  const e = outCubic(t / T.flyEnd);
  const P0 = screenToWorld(0.76, -0.5), C = screenToWorld(0.84, 0.3), P1 = new THREE.Vector3();
  const pos = new THREE.Vector3()
    .addScaledVector(P0, (1 - e) * (1 - e)).addScaledVector(C, 2 * (1 - e) * e).addScaledVector(P1, e * e);
  const sc = 0.26 + 0.74 * outBack(t / (T.flyEnd + 0.3));
  const rx = (1 - e) * 0.45;
  const ry = (1 - e) * -Math.PI * 2 * P.spins;
  let rz = THREE.MathUtils.lerp(0.55, TILT, e);
  rz = THREE.MathUtils.lerp(rz, 0, ss((t - T.uprightStart) / (T.uprightEnd - T.uprightStart)));
  if (t > T.tearStart && t < T.tearStart + 0.35) {
    const k = (t - T.tearStart) / 0.35;
    rz += 0.035 * Math.sin(k * Math.PI * 5) * (1 - k);
  }
  rig.position.copy(pos);
  rig.rotation.set(rx, ry, rz);
  rig.scale.setScalar(sc);
  rig.updateMatrixWorld(true);
  return rig.matrixWorld.clone();
}

function apply(t) {
  if (!ready) return;
  const rm = rigAt(t);
  curlStrip(ss((t - T.tearStart) / (T.tearEnd - T.tearStart)));
  if (t <= T.tearEnd) {
    strip.visible = true;
    strip.matrix.multiplyMatrices(rm, stripLocal);
  } else {
    const m0 = rigAt(T.tearEnd).multiply(stripLocal); rigAt(t);
    stripGeo.computeBoundingBox();
    const c = stripGeo.boundingBox.getCenter(new THREE.Vector3());     // 以捲好的卷為中心縮放
    const k = clamp01((t - T.tearEnd) / (T.dropEnd - T.tearEnd));
    const sc = k < 0.3 ? 1 + 0.18 * ss(k / 0.3) : 1.18 * (1 - ss((k - 0.3) / 0.7));
    strip.visible = sc > 0.002;
    strip.matrix.copy(m0).multiply(new THREE.Matrix4().makeTranslation(c.x, c.y, c.z))
      .multiply(new THREE.Matrix4().makeScale(sc, sc, sc)).multiply(new THREE.Matrix4().makeTranslation(-c.x, -c.y, -c.z));
  }
  strip.matrixWorldNeedsUpdate = true;
  const m = ss((t - T.openStart) / (T.openEnd - T.openStart));
  for (const o of morphMeshes) o.morphTargetInfluences[0] = m;
  const pk = (t - T.patchStart) / (T.patchEnd - T.patchStart);
  patch.position.set(patch0.x, patch0.y + 0.095 * ss(pk), patch0.z);
  // 果凍 Q 彈：抽到頂後上下晃兩下
  const w = Math.max(0, t - T.patchEnd), wob = w > 0 ? Math.sin(w * 22) * Math.exp(-w * 6) * 0.06 : 0;
  patch.scale.set(1 - wob * 0.5, 1 + wob, 1);
  patch.rotation.z = Math.sin(clamp01(pk) * Math.PI) * 0.04;
  let name = SHOTS[0][1];
  for (const [st, n] of SHOTS) if (t >= st) name = n;
  document.getElementById('shotname').textContent = name;
  document.getElementById('time').textContent = `${t.toFixed(2)} / ${T.total.toFixed(2)} s`;
}

// ---------- 播放控制 ----------
let t = 0, playing = false;
const scrub = document.getElementById('scrub'), playBtn = document.getElementById('play');
function play() { if (t >= T.total - 0.001) t = 0; playing = true; playBtn.textContent = '暫停'; }
function pause() { playing = false; playBtn.textContent = t >= T.total - 0.001 ? '重播' : '播放'; }
playBtn.onclick = () => (playing ? pause() : play());
scrub.oninput = () => { pause(); t = +scrub.value; apply(t); };
function buildMarks() {
  scrub.max = T.total;
  const marks = document.getElementById('marks'); marks.innerHTML = '';
  for (const [st, n] of SHOTS) {
    const s = document.createElement('span');
    s.textContent = n.split('　')[0];
    s.style.left = `calc(${(st / T.total) * 100}% + ${8 - (st / T.total) * 16}px)`;
    s.onclick = () => { pause(); t = st; scrub.value = t; apply(t); };
    marks.appendChild(s);
  }
}
buildMarks();
window.__setT = (v) => { pause(); t = v; scrub.value = v; apply(v); };

// ---------- 調整面板 ----------
const inputs = {};
function fmt(d, v) { return (d[4] < 1 ? (+v).toFixed(d[4] < 0.1 ? 2 : 1) : v) + d[6]; }
for (const d of DEFS) {
  const [key, label, min, max, step, , , group, help] = d;
  const wrap = document.createElement('div'); wrap.className = 'ctl';
  wrap.innerHTML = `<div class="top"><span>${label}</span><output></output></div>
    <input type="range" min="${min}" max="${max}" step="${step}">${help ? `<small>${help}</small>` : ''}`;
  const inp = wrap.querySelector('input'), out = wrap.querySelector('output');
  inp.value = P[key]; out.textContent = fmt(d, P[key]);
  inp.oninput = () => {
    P[key] = +inp.value; out.textContent = fmt(d, P[key]); save();
    if (group === 'cam') { setupCamera(); apply(t); }
    else if (key !== 'speed') {
      const ratio = t / T.total; buildTimeline(); buildMarks();
      t = Math.min(T.total, ratio * T.total); scrub.value = t; apply(t);
    }
  };
  inputs[key] = { inp, out, d };
  document.getElementById(group === 'cam' ? 'camCtls' : 'speedCtls').appendChild(wrap);
}
document.getElementById('reset').onclick = () => {
  for (const d of DEFS) { P[d[0]] = d[5]; inputs[d[0]].inp.value = d[5]; inputs[d[0]].out.textContent = fmt(d, d[5]); }
  save(); setupCamera(); buildTimeline(); buildMarks(); t = 0; play();
};
document.getElementById('copy').onclick = async () => {
  const text = '青蛙貼布動畫參數\n' + DEFS.map((d) => `${d[1]}：${fmt(d, P[d[0]])}`).join('\n');
  const msg = document.getElementById('copied'), dump = document.getElementById('dump');
  try { await navigator.clipboard.writeText(text); msg.textContent = '已複製，可以直接貼給 Claude'; dump.style.display = 'none'; }
  catch (e) { dump.value = text; dump.style.display = 'block'; dump.select(); msg.textContent = '無法自動複製，請手動複製下面的文字'; }
};
const panel = document.getElementById('panel');
document.getElementById('toggle').onclick = (e) => {
  panel.classList.toggle('min'); document.body.classList.toggle('pmin', panel.classList.contains('min')); e.target.textContent = panel.classList.contains('min') ? '展開' : '收合';
  setupCamera(); apply(t);
};

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); setupCamera(); apply(t); });
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (ready && playing) {
    t += dt * P.speed;
    if (t >= T.total) {
      if (document.getElementById('loop').checked) t = 0; else { t = T.total; pause(); }
    }
    scrub.value = t; apply(t);
  }
  renderer.render(scene, camera);
});
</script>
</body>
