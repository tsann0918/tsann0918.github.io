<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貼布結構介紹 3D 分解動畫（平面特效版）</title>
<style>
  html,body { margin:0; background:linear-gradient(#eac5d1,#e884a2) fixed;
    font-family:system-ui,'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; }
  body.auto { height:100%; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }
  #track { height:700vh; display:none; }
  body.scroll #track { display:block; }
  svg#lines { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  .lab { position:fixed; transform:translateY(-50%); font-size:14px; color:#fff; pointer-events:none;
    text-shadow:0 1px 6px #a0305a66; white-space:nowrap; }
  .lab b { display:block; font-size:16px; }
  .lab small { opacity:.85; font-size:12px; letter-spacing:.06em; }
  .bar { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); display:flex; gap:10px; align-items:center;
    background:#ffffffd9; padding:8px 14px; border-radius:14px; box-shadow:0 6px 24px #9c2f5a22; font-size:13px; color:#5a2238;
    flex-wrap:wrap; justify-content:center; max-width:calc(100% - 24px); }
  .bar input[type=range] { width:200px; accent-color:#e2557f; }
  .seg { display:flex; background:#f6dce5; border-radius:10px; padding:3px; }
  .seg button { font:inherit; border:0; border-radius:8px; padding:5px 11px; background:transparent; color:#5a2238; cursor:pointer; }
  .seg button.on { background:#e2557f; color:#fff; }
  label { display:flex; gap:5px; align-items:center; cursor:pointer; user-select:none; }
  #hint { position:fixed; left:50%; bottom:86px; transform:translateX(-50%); color:#fff; font-size:13px; opacity:0;
    transition:opacity .4s; text-shadow:0 1px 6px #a0305a66; pointer-events:none; }
  body.scroll #hint.show { opacity:1; }
</style>
</head>
<body class="auto">
<div id="stage"></div>
<svg id="lines"></svg>
<div id="labels"></div>
<div id="track"></div>
<div id="hint">往下捲動 ↓</div>
<div class="bar">
  <div class="seg"><button id="mAuto" class="on">自動播放</button><button id="mScroll">跟著捲動</button></div>
  <input id="prog" type="range" min="0" max="1" step="0.001" value="0" aria-label="進度">
  <label><input id="showLab" type="checkbox"> 層名</label>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { makeFourLayerPatch } from '../../../js/patch.js';

// ================= 時間軸（故事時間，秒）=================
// 分解 → 1 深層吸收 → 2 疼痛搜集 → 3 射線轉換 → 4 能量匯集 → 5 定向發射 → 收合
const S = {
  explode: [0, 1.2],
  absorb: [1.2, 3.4],
  collect: [3.0, 5.6],
  convert: [5.3, 7.4],
  gather: [7.1, 8.9],
  emit: [8.6, 10.8],
  close: [11.2, 12.4],
  loop: 13.0,
  scrollEnd: 10.2,           // 捲動模式：捲到底停在光柱射出的畫面
};
const GAP = 0.045;

// ================= 基本場景 =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 512;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#eac5d1'); g.addColorStop(0.5, '#e9a4ba'); g.addColorStop(1, '#e884a2');
  x.fillStyle = g; x.fillRect(0, 0, 2, 512);
  scene.background = new THREE.CanvasTexture(c); scene.background.colorSpace = THREE.SRGBColorSpace;
}
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;
const key = new THREE.DirectionalLight('#ffffff', 1.5); key.position.set(0.2, 1, 0.4); scene.add(key);
scene.add(new THREE.HemisphereLight('#ffffff', '#f3b3c8', 0.5));

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 10);


const patch = makeFourLayerPatch(THREE, RoundedBoxGeometry);
const holder = new THREE.Group();
patch.group.rotation.set(-Math.PI / 2, 0, 0);       // 平躺、正面朝上
holder.add(patch.group);
scene.add(holder);
const Lyr = patch.layers;

function frame() {
  camera.aspect = innerWidth / innerHeight;
  const narrow = camera.aspect < 0.9, d = narrow ? 0.9 : 0.62;
  camera.position.set(0, d * 0.55, d * 0.84);
  camera.lookAt(0, 0.01, 0);
  camera.setViewOffset(innerWidth, innerHeight, 0, 0, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
frame();
addEventListener('resize', frame);

// ================= 共用：會流動的發光管線材質 =================
function flowMat(a, b, speed = 1, band = 0.65, bands = 3) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: { value: 0 }, uGrow: { value: 0 }, uOpacity: { value: 0 }, uSpeed: { value: speed },
      uA: { value: new THREE.Color(a) }, uB: { value: new THREE.Color(b) }, uI: { value: band }, uN: { value: bands } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `uniform float uTime,uGrow,uOpacity,uSpeed,uI,uN; uniform vec3 uA,uB; varying vec2 vUv;
      void main(){
        float s = vUv.x; if (s > uGrow) discard;
        float f = fract(s * uN - uTime * uSpeed);
        float band = smoothstep(.35, .5, f) * (1. - smoothstep(.5, .65, f));
        vec3 col = mix(mix(uA, uB, s), vec3(1.), band * uI);
        gl_FragColor = vec4(col, uOpacity);
        #include <colorspace_fragment>
      }`,
  });
}
const flat = (hex) => new THREE.MeshBasicMaterial({ color: hex, transparent: true, depthWrite: false });
const glow = (hex) => flat(hex);
function spriteTex(draw) {
  const c = document.createElement('canvas'); c.width = c.height = 128; draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const chevronTex = spriteTex((x) => {
  x.strokeStyle = '#ffffff'; x.lineWidth = 14; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(22, 92); x.lineTo(64, 40); x.lineTo(106, 92); x.stroke();
});
const CYAN = '#5fd8f0', WHITE = '#ffffff', LIME = '#d2f981', PALE = '#eefbd2';

// ================= 1 深層吸收：下方匯入底層的箭頭 =================
const absorb = new THREE.Group(); Lyr.w2.add(absorb);      // 跟著白色底層移動（局部座標 -Z＝往下）
const arrows = [];
for (let i = 0; i < 9; i++) {
  const a = (i / 9) * Math.PI * 2 + 0.3;
  const ex = Math.cos(a) * 0.03 + (i % 3 - 1) * 0.012, ey = Math.sin(a) * 0.05;
  const sx = Math.cos(a) * 0.15, sy = Math.sin(a) * 0.12;
  const curve = new THREE.CubicBezierCurve3(
    new THREE.Vector3(sx, sy, -0.2), new THREE.Vector3(sx * 0.9, sy * 0.9, -0.09),
    new THREE.Vector3(ex, ey, -0.07), new THREE.Vector3(ex, ey, -0.006));
  const mat = flowMat(CYAN, WHITE, 0.9, 0.65, 2.5);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 60, 0.0016, 8), mat);
  absorb.add(tube);                                          // 只用線，不加箭頭
  arrows.push({ mat, curve, delay: (i % 4) * 0.12 });
}

// ================= 2 疼痛搜集：F 粒子 =================
const fTex = spriteTex((x) => {
  x.fillStyle = '#ffffff'; x.strokeStyle = '#5fd8f0'; x.lineWidth = 8;
  x.beginPath(); x.arc(64, 64, 54, 0, Math.PI * 2); x.fill(); x.stroke();
  x.fillStyle = '#5fd8f0'; x.font = '500 70px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('F', 64, 68);
});
const collect = new THREE.Group(); patch.group.add(collect);
const particles = [];
let seed = 3; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < 26; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: fTex, transparent: true, depthWrite: false }));
  sp.scale.setScalar(0.013);
  const g = new THREE.Group(); g.add(sp); collect.add(g);
  particles.push({ g, sp, x: (rnd() - 0.5) * 0.13, y: (rnd() - 0.5) * 0.15, ph: rnd() * 6.28, d: rnd() * 0.5 });
}

// ================= 3 射線轉換：分子＋電光 =================
const convert = new THREE.Group(); patch.group.add(convert);
const OUTLINE = new THREE.MeshBasicMaterial({ color: '#5fd8f0', side: THREE.BackSide });
function molecule(colors) {
  const m = new THREE.Group();
  const pts = [new THREE.Vector3(-0.011, 0, 0), new THREE.Vector3(0, 0.008, 0.004), new THREE.Vector3(0.011, -0.002, 0)];
  for (let i = 0; i < 2; i++) {
    const a = pts[i], b = pts[i + 1], len = a.distanceTo(b);
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    const mid = a.clone().add(b).multiplyScalar(0.5);
    for (const [r, mat] of [[0.0021, OUTLINE], [0.0016, new THREE.MeshBasicMaterial({ color: '#ffffff' })]]) {
      const bond = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 14), mat);
      bond.position.copy(mid); bond.quaternion.copy(q); m.add(bond);
    }
  }
  pts.forEach((p, i) => {
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.0058, 28, 20), new THREE.MeshBasicMaterial({ color: colors[i % colors.length] }));
    const line = new THREE.Mesh(new THREE.SphereGeometry(0.0058 * 1.14, 28, 20), OUTLINE);
    ball.position.copy(p); line.position.copy(p); m.add(ball, line);
  });
  m.userData.ends = pts;
  return m;
}
const molA = molecule([LIME, PALE, LIME]), molB = molecule([PALE, LIME, PALE]);
molA.position.set(-0.058, 0.012, 0); molB.position.set(0.058, -0.008, 0);
molA.scale.setScalar(1.7); molB.scale.setScalar(1.7);
convert.add(molA, molB);
const boltMat = flat('#5fd8f0');
let bolt = null, boltTimer = 0;
function rebuildBolt() {
  if (bolt) { convert.remove(bolt); bolt.geometry.dispose(); }
  const a = molA.localToWorld(molA.userData.ends[2].clone()), b = molB.localToWorld(molB.userData.ends[0].clone());
  convert.worldToLocal(a); convert.worldToLocal(b);
  const pts = [a];
  const n = 13, side = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3(0, 0, 1)).normalize();
  for (let i = 1; i < n; i++) {
    const p = a.clone().lerp(b, i / n);
    p.addScaledVector(side, (i % 2 ? 1 : -1) * (0.006 + Math.random() * 0.008));
    p.z += (Math.random() - 0.5) * 0.004;
    pts.push(p);
  }
  pts.push(b);
  bolt = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.05), 90, 0.0009, 6), boltMat);
  convert.add(bolt);
}

// ================= 5 定向發射：分岔線匯成光柱 =================
const emit = new THREE.Group(); Lyr.w1.add(emit);          // 跟著白色外層（局部 +Z＝往上）
const branches = [];
[[-0.042, -0.03], [-0.018, 0.035], [0.018, -0.035], [0.042, 0.03]].forEach(([x, y], i) => {
  const curve = new THREE.CubicBezierCurve3(new THREE.Vector3(x, y, 0.003), new THREE.Vector3(x, y, 0.035),
    new THREE.Vector3(x * 0.15, y * 0.15, 0.03), new THREE.Vector3(0, 0, 0.055));
  const mat = flowMat(WHITE, CYAN, 1.3, 0.6, 2);
  emit.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 50, 0.0016, 8), mat));
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.0024, 14, 10), flat(WHITE));
  foot.position.set(x, y, 0.003); emit.add(foot);
  branches.push({ mat, foot });
});
const beamCurve = new THREE.LineCurve3(new THREE.Vector3(0, 0, 0.055), new THREE.Vector3(0, 0, 0.36));
const beamMat = flowMat(CYAN, WHITE, 2.2, 0.6, 4);
emit.add(new THREE.Mesh(new THREE.TubeGeometry(beamCurve, 80, 0.0026, 12), beamMat));
const beamCore = new THREE.Mesh(new THREE.SphereGeometry(0.0042, 20, 14), flat(CYAN));
beamCore.position.set(0, 0, 0.055); emit.add(beamCore);

// ================= 層名（選用）=================
const LABELS = { w1: ['白色外層', 'OUTER FILM'], g: ['綠色凸點層', 'BUMP LAYER'], b: ['藍色電路層', 'F-CIRCUIT'], w2: ['白色底層', 'BASE LAYER'] };
const labWrap = document.getElementById('labels'), svg = document.getElementById('lines');
const labEls = {}, lineEls = {};
for (const k of ['w1', 'g', 'b', 'w2']) {
  const el = document.createElement('div'); el.className = 'lab';
  el.innerHTML = `<b>${LABELS[k][0]}</b><small>${LABELS[k][1]}</small>`; labWrap.appendChild(el); labEls[k] = el;
  const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  ln.setAttribute('stroke', '#ffffffcc'); ln.setAttribute('stroke-width', '1.2'); ln.setAttribute('stroke-dasharray', '5 5');
  svg.appendChild(ln); lineEls[k] = ln;
}
const anc = new THREE.Vector3();
function updateLabels(e, show) {
  const op = show ? Math.max(0, (e - 0.55) / 0.45) : 0, right = Math.min(innerWidth - 190, innerWidth * 0.72);
  for (const k of ['w1', 'g', 'b', 'w2']) {
    anc.set(patch.size.W / 2 - 0.004, -0.02, 0); Lyr[k].localToWorld(anc); anc.project(camera);
    const x = (anc.x + 1) / 2 * innerWidth, y = (1 - anc.y) / 2 * innerHeight, lx = Math.max(right, x + 40);
    Object.assign(labEls[k].style, { left: lx + 12 + 'px', top: y + 'px', opacity: op });
    Object.assign(lineEls[k].style, { opacity: op });
    lineEls[k].setAttribute('x1', x); lineEls[k].setAttribute('y1', y); lineEls[k].setAttribute('x2', lx); lineEls[k].setAttribute('y2', y);
  }
}

// ================= 依故事時間更新 =================
const ss = (v) => { v = Math.min(1, Math.max(0, v)); return v * v * (3 - 2 * v); };
const span = (t, [a, b]) => (t - a) / (b - a);              // 0~1
const env = (t, [a, b], fin = 0.35, fout = 0.4) => ss((t - a) / fin) * (1 - ss((t - (b - fout)) / fout));
const tmpC = new THREE.Color(), HOT = new THREE.Color('#fbffe8');

function apply(t, clock) {
  // 分解／收合
  const e = ss(span(t, S.explode)) * (1 - ss(span(t, S.close)));
  patch.setExplode(e, GAP);
  ['w1', 'g', 'b', 'w2'].forEach((k, i) => { Lyr[k].position.z += Math.sin(clock * 1.3 + i * 0.9) * 0.0022 * e; });

  // 1 深層吸收
  const ka = env(t, S.absorb, 0.2, 0.5), ga = span(t, S.absorb);
  arrows.forEach((ar) => {
    const g = ss((ga - ar.delay) / 0.4);
    ar.mat.uniforms.uGrow.value = g; ar.mat.uniforms.uOpacity.value = ka; ar.mat.uniforms.uTime.value = clock;
  });
  absorb.visible = ka > 0.001;

  // 2 疼痛搜集：從底層升起 → 在兩層間漂浮 → 聚到中心 → 被藍層吸收
  const kc = span(t, S.collect), zW2 = Lyr.w2.position.z, zB = Lyr.b.position.z;
  collect.visible = kc > 0 && kc < 1;
  particles.forEach((p) => {
    const rise = ss((kc - p.d * 0.25) / 0.25), gath = ss((kc - 0.55 - p.d * 0.1) / 0.25), gone = ss((kc - 0.78 - p.d * 0.08) / 0.14);
    const wx = Math.sin(clock * 1.7 + p.ph) * 0.004, wy = Math.cos(clock * 1.3 + p.ph * 1.3) * 0.004;
    const midZ = zW2 + (zB - zW2) * (0.35 + 0.25 * Math.sin(p.ph));
    const x = (p.x + wx) * (1 - gath), y = (p.y + wy) * (1 - gath);
    const z = THREE.MathUtils.lerp(zW2, midZ, rise) + (zB - midZ) * gath;
    p.g.position.set(x, y, z);
    const s = rise * (1 - gone);
    p.g.scale.setScalar(Math.max(0.001, s));
  });

  // 3 射線轉換
  const kv = env(t, S.convert, 0.4, 0.45);
  convert.visible = kv > 0.001;
  convert.position.z = (zB + Lyr.g.position.z) / 2;
  convert.scale.setScalar(Math.max(0.001, ss(kv * 1.4)));
  molA.rotation.set(clock * 0.9, clock * 0.6, 0); molB.rotation.set(-clock * 0.7, clock * 0.8, 0.5);   // 各自自轉
  convert.rotation.z = clock * 0.9;                       // 兩個分子＋閃電整組繞貼布法線公轉
  if (convert.visible && clock - boltTimer > 0.16) { boltTimer = clock; rebuildBolt(); }
  const boltOn = span(t, S.convert) > 0.2 && span(t, S.convert) < 0.92;
  boltMat.opacity = boltOn ? kv : 0;

  // 4 能量匯集：凸起由下往上依序亮起
  const kg = span(t, S.gather), fade = 1 - ss((t - (S.gather[1] - 0.4)) / 0.6);
  const H = patch.size.H;
  patch.spots.forEach(([x, y], i) => {
    const front = kg * 1.25 - (y + H / 2) / H;                // 亮起的波前
    const k = kg > 0 ? ss(front * 4) * fade : 0;
    tmpC.copy(patch.BUMP_BASE).lerp(HOT, k);
    patch.bumps.setColorAt(i, tmpC);
  });
  patch.bumps.instanceColor.needsUpdate = true;

  // 5 定向發射
  const ke = env(t, S.emit, 0.25, 0.6), ge = span(t, S.emit);
  emit.visible = ke > 0.001;
  branches.forEach((b, i) => {
    const g = ss((ge - i * 0.05) / 0.35);
    b.mat.uniforms.uGrow.value = g; b.mat.uniforms.uOpacity.value = ke; b.mat.uniforms.uTime.value = clock;
    b.foot.material.opacity = ke;
  });
  const gb = ss((ge - 0.35) / 0.3);
  beamMat.uniforms.uGrow.value = gb; beamMat.uniforms.uOpacity.value = ke; beamMat.uniforms.uTime.value = clock;
  beamCore.visible = gb > 0.01; beamCore.material.opacity = ke;
  beamCore.scale.setScalar(1 + Math.sin(clock * 6) * 0.08);

  return e;
}

// ================= 模式：自動播放／跟著捲動 =================
const prog = document.getElementById('prog'), hint = document.getElementById('hint');
const bAuto = document.getElementById('mAuto'), bScroll = document.getElementById('mScroll');
let mode = 'auto', storyT = 0, manual = null;
function setMode(m) {
  mode = m; manual = null;
  document.body.className = m;
  bAuto.classList.toggle('on', m === 'auto'); bScroll.classList.toggle('on', m === 'scroll');
  if (m === 'scroll') { scrollTo(0, 0); hint.classList.add('show'); } else storyT = 0;
}
bAuto.onclick = () => setMode('auto');
bScroll.onclick = () => setMode('scroll');
prog.oninput = () => { manual = +prog.value; };
addEventListener('scroll', () => { if (mode === 'scroll') { manual = null; hint.classList.toggle('show', scrollY < 40); } });
function scrollProgress() {
  const max = document.documentElement.scrollHeight - innerHeight;
  return max > 0 ? Math.min(1, scrollY / max) : 0;
}
// 給網站用：window.frogPatch.setProgress(0~1)，0＝組合、1＝發射完成
window.frogPatch = { setProgress: (p) => { manual = Math.min(1, Math.max(0, p)); } };
window.__setT = (t) => { manual = t / S.loop; };

const mouse = new THREE.Vector2();
addEventListener('pointermove', (ev) => mouse.set(ev.clientX / innerWidth - 0.5, ev.clientY / innerHeight - 0.5));
const clk = new THREE.Clock();
let clock = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clk.getDelta(), 0.05); clock += dt;
  let t;
  if (manual !== null) t = mode === 'scroll' ? manual * S.scrollEnd : manual * S.loop;
  else if (mode === 'auto') { storyT = (storyT + dt) % S.loop; t = storyT; }
  else t = scrollProgress() * S.scrollEnd;
  prog.value = mode === 'scroll' ? t / S.scrollEnd : t / S.loop;
  holder.rotation.set(0.1 + mouse.y * 0.12, -0.62 + mouse.x * 0.25 + Math.sin(clock * 0.35) * 0.05, 0.08);
  holder.updateMatrixWorld(true);
  const e = apply(t, clock);
  updateLabels(e, document.getElementById('showLab').checked);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
