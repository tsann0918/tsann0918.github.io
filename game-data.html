<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>遊玩資料｜解壓遊戲 - FROGet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Post+No+Bills+Colombo&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/game-data.css" />
  </head>
  <!-- data-locked：1＝顯示輸入密碼、0＝顯示資料（由 js/slapData.js 切換） -->
  <body class="theme-line data-page" data-locked="1">
    <header class="nav">
      <a class="logo" href="index.html">
        <span class="logo-line1"><span class="logo-name">FROGet</span></span>
      </a>
      <nav class="menu">
        <a href="ask.html">問答</a>
        <a href="shop.html">商店</a>
        <a href="game.html">解壓遊戲</a>
        <a href="index.html#about">關於我們</a>
        <a class="cart-button" href="#">購物車 (<span id="cart-count">0</span>)</a>
      </nav>
    </header>

    <!-- ===== 輸入密碼 ===== -->
    <main class="d-lock" id="lock">
      <p class="g-label">( 管理 ) PLAY DATA</p>
      <h1 class="d-lock-title">遊玩資料</h1>
      <p class="d-lock-desc">這一頁有所有玩家的成績，請輸入 4 位數密碼。</p>
      <form class="d-lock-form" id="lockForm" novalidate>
        <div class="d-pin" id="pin">
          <input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="密碼第 1 碼" />
          <input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="密碼第 2 碼" />
          <input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="密碼第 3 碼" />
          <input type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="密碼第 4 碼" />
        </div>
        <p class="d-lock-error" id="lockError" aria-live="polite"></p>
        <div class="d-lock-actions">
          <button class="g-btn g-btn-dark" type="submit">進入</button>
          <a class="g-btn d-btn-plain" href="game.html">← 回遊戲</a>
        </div>
      </form>
    </main>

    <!-- ===== 資料 ===== -->
    <main class="d-data" id="data">
      <div class="d-head">
        <div class="d-head-title">
          <p class="g-label">( 管理 ) PLAY DATA</p>
          <h1>遊玩資料</h1>
        </div>
        <div class="d-actions">
          <button class="g-btn g-btn-dark" id="exportBtn" type="button">匯出 CSV ↓</button>
          <button class="g-btn g-btn-warn" id="clearBtn" type="button">清除紀錄</button>
          <button class="g-btn d-btn-plain" id="lockBtn" type="button">鎖上離開</button>
        </div>
      </div>

      <section class="d-stats" aria-label="統計">
        <div><p>( 01 ) 總場數</p><p class="d-num" id="stGames">0</p></div>
        <div><p>( 02 ) 玩家數</p><p class="d-num" id="stPlayers">0</p></div>
        <div><p>( 03 ) 平均分</p><p class="d-num" id="stAvg">0</p></div>
        <div class="is-key"><p>( 04 ) 最高分</p><p class="d-num" id="stBest">0</p></div>
        <div><p>( 05 ) 到達階段 2</p><p class="d-num" id="stStage2">0 場</p></div>
        <div><p>( 06 ) 到達階段 3</p><p class="d-num" id="stStage3">0 場</p></div>
      </section>

      <section class="d-table-wrap" aria-labelledby="tbl-title">
        <div class="d-table-head">
          <h2 id="tbl-title">全部成績</h2>
          <span id="tblInfo">點欄位名稱可以排序</span>
        </div>
        <div class="d-scroll">
          <table class="d-table">
            <thead>
              <tr>
                <th scope="col">名次</th>
                <th scope="col"><button type="button" data-sort="name">名字</button></th>
                <th scope="col" class="num"><button type="button" data-sort="score">分數</button></th>
                <th scope="col" class="num"><button type="button" data-sort="hits">打中</button></th>
                <th scope="col" class="num"><button type="button" data-sort="maxCombo">最高連擊</button></th>
                <th scope="col"><button type="button" data-sort="stage">到達階段</button></th>
                <th scope="col"><button type="button" data-sort="t">時間</button></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <p class="d-empty" id="emptyNote" hidden>還沒有任何成績。</p>
      </section>
    </main>

    <script type="module" src="js/slapData.js"></script>
  </body>
</html>
